# Rime schema patch —— 2026-11-23 為主人調校
#
# 原本這裡是：
#   patch:
#     __include: grammar:/hant
# 它會把下列三項一起打開：
#   translator/contextual_suggestions: true   ← 語言模型按上文重排候選，令次序亂
#   translator/max_homophones: 7
#   translator/max_homographs: 7
# 而且它是在方案之後才套用的，所以方案裡寫 false 也會被它改回 true。
#
# 現在索性不用語言模型：速成是「打碼出字」，候選次序應該固定，
# 不應該因為前一個字而跳來跳去。

patch:
  translator/contextual_suggestions: false
  phrase/contextual_suggestions: false

  # ===== 聯想（predict）2026-11-24 =====
  # 用 librime 內建的 librime-predict 插件：打完一個詞，自動猜下一個詞。
  # 資料：predict.db（官方 predict 資料庫，來源 essay + octagram，繁體）
  # 開關：方案選單裡的「聯想」（shift+…或狀態列），預設開。
  # 不要聯想時：把下面三行（processors / translators / switches）刪掉即可。
  'engine/processors/@before 0': predictor
  'engine/translators/@before 0': predict_translator
  'engine/translators/@after last': lua_translator@*assist
  'switches/@after last': {name: prediction, states: [聯想關, 聯想開], reset: 1}
  predictor:
    db: predict.db
    max_candidates: 4
    max_iterations: 1