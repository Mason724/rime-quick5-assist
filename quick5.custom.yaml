# quick5.custom.yaml —— 速成加強補丁
# 2026-11-24
#
# 這個補丁做四件事：
#   1. 聯想：打完一個詞，候選列自動出下一個詞（librime-predict + predict.db）
#   2. 個人配詞學習：記住你慣用的搭配（lua/assist.lua → user_pairs.txt）
#   3. 尾隨單字：打三碼以上時，補上頭兩碼的單字（lua/assist.lua）
#   4. 壓住 Rime 的統計語言模型（contextual_suggestions），避免候選次序跳來跳去
#
# 想關掉聯想（例如覺得彈窗打擾）：把下面 switches 那行的 reset: 1 改成 reset: 0，
# 重新部署即可；其餘功能不受影響。

patch:
  translator/contextual_suggestions: false
  phrase/contextual_suggestions: false

  # ===== 聯想 =====
  # quiet_ctrl：按 Ctrl／Alt 時暫時關掉聯想，避免複製貼上時彈窗；
  #             聯想窗開著時按 Backspace，先關窗再照常刪字。
  'engine/processors/@before 0': lua_processor@*quiet_ctrl
  'engine/processors/@after last': predictor
  'engine/translators/@before 0': predict_translator
  # assist：個人配詞學習 + 尾隨單字
  'engine/translators/@after last': lua_translator@*assist
  # reset: 1 = 預設開聯想；改 0 就是預設關
  'switches/@after last': {name: prediction, states: [聯想關, 聯想開], reset: 1}
  predictor:
    db: predict.db
    max_candidates: 4
    max_iterations: 1
